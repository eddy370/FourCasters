<title id="title">FourCasters — modèle dimensionnel : faits et dimensions</title>
<desc id="desc">Vue synthétique du schéma existant. Date est reliée aux faits météo et hydrologiques ; commune aux faits météo ; station aux faits hydrologiques. Département est relié à commune, station et aux faits ONRN. Chaque relation va de un à zéro ou plusieurs. Le modèle SQL du fait ONRN n'est pas versionné.</desc>
