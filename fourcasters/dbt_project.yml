# Name your project! Project names should contain only lowercase characters
# and underscores.
name: 'fourcasters'
version: '1.0.0'

profile: 'fourcasters'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"


# Configuring models
models:
  fourcasters:
    staging:
      +materialized: view
      +schema: staging

    marts:
      +materialized: table
      +schema: marts
