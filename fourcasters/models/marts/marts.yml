version: 2

models:
  - name: fct_meteo_journaliere
    description: >
      Table de faits météorologiques journaliers.
      Une ligne correspond à une commune et une date.

    columns:
      - name: row_hash
        description: "Identifiant technique unique d'une observation commune-date."
        tests:
          - not_null
          - unique

      - name: code_insee
        description: "Code INSEE de la commune."
        tests:
          - not_null

      - name: date
        description: "Date de l'observation météorologique."
        tests:
          - not_null


  - name: dim_commune
    description: >
      Dimension géographique contenant une ligne par commune.

    columns:
      - name: code_insee
        description: "Code INSEE unique de la commune."
        tests:
          - not_null
          - unique

      - name: ville
        description: "Nom de la commune."
        tests:
          - not_null

      - name: departement
        description: "Numéro du département."

      - name: region
        description: "Région administrative."


  - name: dim_date
    description: >
      Dimension temporelle contenant une ligne par date.

    columns:
      - name: date
        description: "Date unique."
        tests:
          - not_null
          - unique

      - name: annee
        description: "Année correspondant à la date."

      - name: trimestre
        description: "Trimestre de l'année."

      - name: mois
        description: "Numéro du mois."

      - name: semaine
        description: "Numéro de semaine."

      - name: jour
        description: "Jour du mois."

      - name: jour_semaine
        description: "Numéro du jour de la semaine."


  - name: dim_station
    description: >
      Dimension des stations hydrométriques Hub'Eau. Une ligne
      correspond à une station ayant au moins une observation HIXnJ
      dans le périmètre FourCasters (2 022 stations), et non aux 6 470
      stations du référentiel national Hub'Eau.

    columns:
      - name: code_station
        description: "Identifiant unique de la station hydrométrique."
        tests:
          - not_null
          - unique

      - name: code_commune_station
        description: >
          Code INSEE de la commune de la station, au même format que
          dim_commune.code_insee. Peut être null (référentiel national).
          Pas de test relationships vers dim_commune : une station peut
          être à <= 15 km d'une commune FourCasters sans lui appartenir
          administrativement, la couverture n'est donc pas garantie.

      - name: en_service
        description: "Indique si la station est actuellement en service."
        tests:
          - not_null


  - name: fct_observation_hydro
    description: >
      Table de faits des observations hydrométriques élaborées Hub'Eau.
      Une ligne correspond à une observation
      (code_station + date_obs_elab + grandeur_hydro_elab). Seule la
      grandeur HIXnJ (hauteur instantanée maximale journalière) est
      disponible pour l'instant.

    columns:
      - name: row_hash
        description: >
          Hash d'identité de l'observation (code_station + date_obs_elab
          + grandeur_hydro_elab), hérité de stg_hubeau_obs_elab.
        tests:
          - not_null
          - unique

      - name: code_station
        description: "Identifiant de la station hydrométrique observée."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: code_station

      - name: date_obs_elab
        description: "Date de l'observation élaborée."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date

      - name: grandeur_hydro_elab
        description: "Code de la grandeur hydrométrique observée (HIXnJ pour l'instant)."
        tests:
          - not_null

  - name: dim_departement
    description: >
      Dimension géographique contenant une ligne par département.

    columns:
      - name: code_departement
        description: "Code unique du département."
        tests:
          - not_null
          - unique

      - name: departement
        description: "Nom du département."
        tests:
          - not_null

      - name: region
        description: "Région administrative."