version: 2

sources:
  - name: openmeteo_raw
    project: projet-les-fourcasters
    dataset: raw_openmeteo

    tables:
      - name: open_meteo
        description: >
          Données météorologiques journalières Open-Meteo, du 2000-01-01
          au 2026-08-01. Table RAW : 360 lieux, 3 495 600 lignes. Union de
          deux schémas de localisation issus de deux ingestions distinctes :
          POI (nom_poi, numero_departement, latitude_poi, longitude_poi,
          267 lieux) et Ville (Ville, Departement, Latitude, Longitude,
          93 lieux).