version: 2

sources:
  - name: hubeau_raw
    project: projet-les-fourcasters
    dataset: raw_hubeau

    tables:
      - name: stations_hydrometriques
        description: >
          Référentiel national des stations hydrométriques Hub'Eau.
          Grain : 1 ligne par station. Table remplacée intégralement
          à chaque actualisation (WRITE_TRUNCATE côté ingestion).

      - name: observations_hydrometriques_elaborees
        description: >
          Observations hydrométriques élaborées Hub'Eau (obs_elab).
          Une clé métier est code_station + date_obs_elab + grandeur_hydro_elab.
          Plusieurs versions de contenu peuvent être conservées pour cette clé.
          La grandeur HIXnJ est chargée pour les stations pertinentes (règle des 15 km).
          Le traitement quotidien relit 35 jours et rattrape les interruptions
          du chargement quotidien à partir de la dernière date de la source. Le chargement initial de l'historique
          reste une étape distincte ; sa couverture doit être contrôlée.
